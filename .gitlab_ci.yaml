# PYTHON 
image: python:3.11

stages:
  - test
  - deploy


before_script:
  - pip install .


test:
  stage: test
  script:
  - mkdocs build --strict --verbose --site-dir test
  artifacts:
    paths:
    - test


pages:
  stage: deploy
  script:
  - mkdocs build --strict --verbose
  - mv site public
  artifacts:
    paths:
    - public
  only:
    - variables:
      - $CI_COMMIT_BRANCH == "main"
    
