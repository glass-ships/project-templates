[project]
name = "PYTHON_PROJECT"
version = "0.1.0"
description = "PACKAGE_DESCRIPTION"
authors = [{ name = "Glass Ships", email = "contact@glass-ships.com" }]
requires-python = ">=3.13, <4.0"
readme = "README.md"
license = "GPL-3.0-or-later"
classifiers = [
    "Programming Language :: Python :: 3",
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Natural Language :: English",
    "Operating System :: POSIX :: Linux",
]

dependencies = [
    ### Core
    "typer",
    "loguru",
    "psutil",
    "rich",
    ### API Server
    "fastapi",
    "uvicorn",
]

[project.optional-dependencies]
dev = ["mkdocs", "mkdocs-material", "mkdocstrings[python]", "pytest", "ruff"]

[project.scripts]
my_app = "python_project.main:app"
my_api = "python_project.api.main:run"

[project.urls]
Homepage = "https://gitlab.com/glass-ships/compass-bot"
Documentation = "https://glass-ships.gitlab.io/compass-bot/"
Repository = "https://gitlab.com/glass-ships/compass-bot"
Issues = "https://gitlab.com/glass-ships/compass-bot/-/issues"

####################
### Build config ###
####################

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/python_project"]

############
### Ruff ###
############

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = [
    "F541", # f-strings with no placeholders
]
# exclude = []
