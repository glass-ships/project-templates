[project]
site_name = "Project Templates"
repo_name = ""
repo_url = "https://gitlab.com/glass-ships/"
# paths here are relative to this file. Build with `zensical build -f docs/zensical.toml` from the
# repo root, or `zensical build` from docs/. Zensical needs the site inside this folder: docs/site/
docs_dir = "."
site_dir = "site"
# docs_dir is this folder, so keep this file out of the published site
exclude_docs = """
zensical.toml
"""
copyright = "Copyright &copy; 2020 - 2026 Glass Ships"

# docs/frontend/api/ is generated by `bun run docs` in frontend/; its index lists every module
nav = [
  { "Home" = "index.md" },
  { "Python" = [
    "python/index.md",
    { "Overview" = "python/index.md" },
    { "Command-line app" = "python/cli.md" },
    { "API server" = "python/api-server.md" },
    { "Logging" = "python/logging.md" },
    { "API reference" = "python/reference.md" },
  ] },
  { "Frontend" = [
    "frontend/index.md",
    { "Overview" = "frontend/index.md" },
    { "Theming" = "frontend/theming.md" },
    { "Links and routing" = "frontend/routing.md" },
    { "Testing" = "frontend/testing.md" },
    { "API reference" = "frontend/api/index.md" },
  ] },
]

[project.theme]
language = "en"
logo = ""
favicon = ""
features = [
  "content.code.copy",
  "navigation.expand",
  "navigation.indexes",
  "navigation.instant",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.tracking",
]

[project.theme.font]
text = "Source Sans Pro"
code = "Source Code Pro"

[[project.theme.palette]]
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle.icon = "material/brightness-2"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "indigo"
accent = "indigo"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/solid/house"
link = "https://glass-ships.com"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/glass-ships/"

[[project.extra.social]]
icon = "fontawesome/brands/gitlab"
link = "https://gitlab.com/glass-ships/"

# Python API reference: `::: module.path` in a page renders its docstrings
[project.plugins.mkdocstrings.handlers.python]
paths = ["../python/src"]
inventories = ["https://docs.python.org/3/objects.inv"]

[project.plugins.mkdocstrings.handlers.python.options]
# See: https://mkdocstrings.github.io/python/usage/
docstring_style = "google"
docstring_section_style = "table"
merge_init_into_class = true
show_signature = false
show_source = false
show_root_full_path = false
show_root_toc_entry = false
filters = ["!^_[^_]"]

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
toc.permalink = true
pymdownx.betterem = {}
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.magiclink = {}
pymdownx.snippets.check_paths = true
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
