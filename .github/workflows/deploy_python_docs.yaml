name: Build and Deploy Docs to GitHub Pages

on:
  pull_request:
  push:
    branches:
      - main

defaults:
  run:
    working-directory: ./python

jobs:
  build-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to push the built site to the gh-pages branch
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: python/pyproject.toml

      # mkdocs is in the python project's dev extra; mkdocs.yaml is at the repo root
      - name: Install packages
        run: uv sync --extra dev --project python

      - name: Build documentation
        run: uv run --no-sync --project python mkdocs build --strict

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        if: github.ref == 'refs/heads/main'
        with:
          folder: site
          target-folder: docs
          clean: true
