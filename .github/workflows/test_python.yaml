name: Test Python

on:
  pull_request:
  workflow_dispatch:

defaults:
  run:
    working-directory: ./python

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14", "3.15"]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # sets UV_PYTHON, so every uv command below uses this version, not the newest one installed
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: python/pyproject.toml

      # the dev extra has pytest and ruff (uv.lock is gitignored, so this resolves fresh)
      - name: Install packages
        run: uv sync --extra dev

      - name: Lint
        run: uv run --no-sync ruff check .

      - name: Check formatting
        run: uv run --no-sync ruff format --check .

      - name: Run tests
        run: uv run --no-sync pytest tests
