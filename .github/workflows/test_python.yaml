name: Test Backend

on:
  pull_request:
  workflow_dispatch:

env:
  PYTHONPATH: ${{ github.workspace }}/python

defaults:
  run:
    working-directory: ./python

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        os: [ubuntu-latest]

    env:
      # Every uv command in this job must target the matrix interpreter.
      # Without this, `uv run` would rebuild the
      # environment on the pinned version and each leg would silently test the
      # same Python.
      UV_PYTHON: ${{ matrix.python-version }}

    steps:
      - uses: actions/checkout@main

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@main
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@main
        with:
          enable-cache: true

      - name: Verify lockfile is up-to-date
        run: |
          uv lock --check

      - name: Install library
        run: |
          uv sync

      - name: Run tests
        run: |
          uv run pytest tests
